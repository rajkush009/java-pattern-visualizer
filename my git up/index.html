<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Pattern Visualizer</title>
<style>
  :root{
    --bg-deep:#11121a;
    --panel:#171925;
    --panel-alt:#1e2130;
    --border:#2a2d40;
    --text:#e4e6f1;
    --dim:#7d81a0;
    --amber:#f4b860;
    --mint:#6ee7b7;
    --rose:#f472b6;
    --blue:#7aa2f7;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Noto Sans Devanagari", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg-deep); color:var(--text);
    font-family:var(--sans); padding:18px;
  }
  .wrap{max-width:1100px; margin:0 auto;}
  header{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    margin-bottom:14px;
  }
  h1{
    font-size:19px; margin:0; font-weight:700; letter-spacing:.2px;
  }
  h1 .pc{color:var(--amber);}
  .sub{color:var(--dim); font-size:13px; margin:0;}

  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    background:var(--panel); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; margin-bottom:14px;
  }
  .ctrl-group{display:flex; flex-direction:column; gap:4px;}
  .ctrl-group label{font-size:11px; color:var(--dim);}
  select, input[type=range]{
    background:var(--panel-alt); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:6px 8px; font-family:var(--sans); font-size:13px;
  }
  select{cursor:pointer;}
  .btns{display:flex; gap:6px; margin-left:auto;}
  button{
    background:var(--panel-alt); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer;
    font-family:var(--sans); transition:transform .1s, border-color .15s;
  }
  button:hover{border-color:var(--amber);}
  button:active{transform:scale(.96);}
  button.play{background:var(--amber); color:#1a1508; border-color:var(--amber); font-weight:600;}
  .checkbox-row{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim);}

  .grid-main{
    display:grid; grid-template-columns: 1.1fr 1fr; gap:14px;
  }
  @media (max-width:760px){ .grid-main{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:14px; min-width:0;
  }
  .panel h2{
    font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim);
    margin:0 0 10px 0; font-weight:600;
  }

  code.line{
    display:flex; gap:10px; font-family:var(--mono); font-size:13px;
    padding:2px 8px; border-radius:5px; white-space:pre; color:var(--text);
    line-height:1.65;
  }
  code.line .ln{color:var(--dim); width:16px; text-align:right; flex-shrink:0; user-select:none;}
  code.line.active{background:rgba(244,184,96,.15); box-shadow:inset 3px 0 0 var(--amber);}
  code.line.active .ln{color:var(--amber);}

  .watch{
    display:flex; gap:10px; margin:12px 0 4px 0; flex-wrap:wrap;
  }
  .chip{
    font-family:var(--mono); font-size:12px; padding:5px 10px; border-radius:20px;
    border:1px solid var(--border); background:var(--panel-alt); color:var(--dim);
    transition:all .15s;
  }
  .chip b{color:inherit;}
  .chip.i.on{border-color:var(--rose); color:var(--rose); box-shadow:0 0 0 2px rgba(244,114,182,.12);}
  .chip.j.on{border-color:var(--blue); color:var(--blue); box-shadow:0 0 0 2px rgba(122,162,247,.12);}

  .explain{
    font-size:12.5px; color:var(--dim); margin-top:10px; min-height:34px;
    border-top:1px dashed var(--border); padding-top:8px; line-height:1.5;
  }
  .explain b{color:var(--text);}

  .stage-grid{
    display:grid; gap:3px; justify-content:center; margin:6px auto 10px auto;
  }
  .cell{
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:15px; border-radius:4px;
    background:var(--panel-alt); color:transparent;
    transition:background .15s, color .1s, transform .15s;
  }
  .cell.star{color:var(--mint); background:rgba(110,231,183,.12); transform:scale(1.02);}
  .cell.space-dot{color:var(--dim); background:transparent;}
  .cell.pulse{outline:2px solid var(--amber);}

  .console{
    margin-top:10px; background:#0b0c13; border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; font-family:var(--mono); font-size:13px;
    color:var(--mint); min-height:60px; max-height:180px; overflow:auto;
    white-space:pre-wrap; line-height:1.5;
  }
  .console .caret{display:inline-block; width:7px; height:14px; background:var(--mint);
    vertical-align:middle; animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}

  .progress{
    height:4px; background:var(--panel-alt); border-radius:3px; overflow:hidden; margin-top:10px;
  }
  .progress > div{height:100%; background:var(--amber); width:0%; transition:width .1s linear;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="pc">▍</span>Java Pattern Visualizer</h1>
    <p class="sub">loop chalne ke saath code aur output दोनों साथ-साथ देखो</p>
  </header>

  <div class="controls">
    <div class="ctrl-group">
      <label>पैटर्न</label>
      <select id="patternSel">
        <option value="triangle">Right Triangle</option>
        <option value="invTriangle">Inverted Right Triangle</option>
        <option value="pyramid">Pyramid</option>
        <option value="invPyramid">Inverted Pyramid</option>
        <option value="diamond">Diamond</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>पंक्तियाँ (n = <span id="nVal">5</span>)</label>
      <input type="range" id="nRange" min="3" max="9" value="5" style="width:120px;">
    </div>
    <div class="ctrl-group">
      <label>गति</label>
      <input type="range" id="speedRange" min="1" max="10" value="6" style="width:100px;">
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="showSpaces" checked>
      <label for="showSpaces">spaces दिखाएं (·)</label>
    </div>
    <div class="btns">
      <button id="backBtn" title="एक कदम पीछे">⏮ पीछे</button>
      <button id="playBtn" class="play">▶ चलाएँ</button>
      <button id="stepBtn" title="एक कदम आगे">अगला ⏭</button>
      <button id="resetBtn">↺ रीसेट</button>
    </div>
  </div>

  <div class="grid-main">
    <div class="panel">
      <h2>Java Code</h2>
      <div id="codeBox"></div>
      <div class="watch">
        <span class="chip i" id="chipI">i = —</span>
        <span class="chip j" id="chipJ">j = —</span>
      </div>
      <div class="explain" id="explainBox">▶ दबाओ या "अगला" पर क्लिक करके शुरू करो।</div>
      <div class="progress"><div id="progBar"></div></div>
    </div>

    <div class="panel">
      <h2>Output (visual)</h2>
      <div id="stageGrid" class="stage-grid"></div>
      <h2 style="margin-top:14px;">Console (System.out)</h2>
      <div class="console" id="consoleBox"><span class="caret"></span></div>
    </div>
  </div>
</div>

<script>
const codeBox = document.getElementById('codeBox');
const stageGrid = document.getElementById('stageGrid');
const consoleBox = document.getElementById('consoleBox');
const explainBox = document.getElementById('explainBox');
const chipI = document.getElementById('chipI');
const chipJ = document.getElementById('chipJ');
const progBar = document.getElementById('progBar');
const patternSel = document.getElementById('patternSel');
const nRange = document.getElementById('nRange');
const nVal = document.getElementById('nVal');
const speedRange = document.getElementById('speedRange');
const showSpaces = document.getElementById('showSpaces');
const playBtn = document.getElementById('playBtn');
const stepBtn = document.getElementById('stepBtn');
const backBtn = document.getElementById('backBtn');
const resetBtn = document.getElementById('resetBtn');

const CODES = {
  triangle: [
    'for (int i = 1; i <= n; i++) {',
    '  for (int j = 1; j <= i; j++) {',
    '    System.out.print("*");',
    '  }',
    '  System.out.println();',
    '}'
  ],
  invTriangle: [
    'for (int i = n; i >= 1; i--) {',
    '  for (int j = 1; j <= i; j++) {',
    '    System.out.print("*");',
    '  }',
    '  System.out.println();',
    '}'
  ],
  pyramid: [
    'for (int i = 1; i <= n; i++) {',
    '  for (int j = 1; j <= n - i; j++) {',
    '    System.out.print(" ");',
    '  }',
    '  for (int j = 1; j <= i; j++) {',
    '    System.out.print("*");',
    '  }',
    '  System.out.println();',
    '}'
  ],
  invPyramid: [
    'for (int i = n; i >= 1; i--) {',
    '  for (int j = 1; j <= n - i; j++) {',
    '    System.out.print(" ");',
    '  }',
    '  for (int j = 1; j <= i; j++) {',
    '    System.out.print("*");',
    '  }',
    '  System.out.println();',
    '}'
  ],
  diamond: [
    '// upper half',
    'for (int i = 1; i <= n; i++) {',
    '  for (int j = 1; j <= n - i; j++) {',
    '    System.out.print(" ");',
    '  }',
    '  for (int j = 1; j <= i; j++) {',
    '    System.out.print("*");',
    '  }',
    '  System.out.println();',
    '}',
    '// lower half',
    'for (int i = n - 1; i >= 1; i--) {',
    '  for (int j = 1; j <= n - i; j++) {',
    '    System.out.print(" ");',
    '  }',
    '  for (int j = 1; j <= i; j++) {',
    '    System.out.print("*");',
    '  }',
    '  System.out.println();',
    '}'
  ]
};
// codes are 0-indexed above, generators use 1-indexed line refs -> convert (line-1)

function genTriangle(n){
  const steps=[];
  for(let i=1;i<=n;i++){
    steps.push({type:'row-start', i, line:1, note:`बाहरी loop: i = ${i} पर पंक्ति शुरू`});
    for(let j=1;j<=i;j++){
      steps.push({type:'check', i,j,line:2, note:`अंदर वाला loop check: j = ${j} (<= i यानी ${i})`});
      steps.push({type:'star', i,j,line:3,row:i-1,col:j-1, note:`print("*") → row ${i}, position ${j} पर तारा`});
    }
    steps.push({type:'newline', i, line:5, note:`println() → अगली लाइन पर जाओ`});
  }
  return steps;
}
function genInvTriangle(n){
  const steps=[];
  for(let i=n;i>=1;i--){
    const rowIdx = n-i;
    steps.push({type:'row-start', i, line:1, note:`i = ${i} (घटते क्रम में)`});
    for(let j=1;j<=i;j++){
      steps.push({type:'check', i,j,line:2, note:`j = ${j} (<= i यानी ${i})`});
      steps.push({type:'star', i,j,line:3,row:rowIdx,col:j-1, note:`print("*") → ${i} तारे वाली पंक्ति`});
    }
    steps.push({type:'newline', i, line:5, note:`println()`});
  }
  return steps;
}
function genPyramid(n){
  const steps=[];
  for(let i=1;i<=n;i++){
    steps.push({type:'row-start', i, line:1, note:`i = ${i}`});
    const sp=n-i;
    for(let j=1;j<=sp;j++){
      steps.push({type:'check', i,j,line:2, note:`space loop: j = ${j} (<= n-i यानी ${sp})`});
      steps.push({type:'space', i,j,line:3,row:i-1,col:j-1, note:`print(" ") → खाली जगह जिससे pyramid center में आए`});
    }
    for(let j=1;j<=i;j++){
      steps.push({type:'check', i,j,line:5, note:`star loop: j = ${j} (<= i यानी ${i})`});
      steps.push({type:'star', i,j,line:6,row:i-1,col:sp+j-1, note:`print("*")`});
    }
    steps.push({type:'newline', i, line:8, note:`println()`});
  }
  return steps;
}
function genInvPyramid(n){
  const steps=[];
  for(let i=n;i>=1;i--){
    const rowIdx=n-i;
    steps.push({type:'row-start', i, line:1, note:`i = ${i} (घटते क्रम में)`});
    const sp=n-i;
    for(let j=1;j<=sp;j++){
      steps.push({type:'check', i,j,line:2, note:`space loop: j = ${j} (<= n-i यानी ${sp})`});
      steps.push({type:'space', i,j,line:3,row:rowIdx,col:j-1, note:`print(" ")`});
    }
    for(let j=1;j<=i;j++){
      steps.push({type:'check', i,j,line:5, note:`star loop: j = ${j} (<= i यानी ${i})`});
      steps.push({type:'star', i,j,line:6,row:rowIdx,col:sp+j-1, note:`print("*")`});
    }
    steps.push({type:'newline', i, line:8, note:`println()`});
  }
  return steps;
}
function genDiamond(n){
  const steps=[];
  for(let i=1;i<=n;i++){
    steps.push({type:'row-start', i, line:2, note:`ऊपरी हिस्सा: i = ${i}`});
    const sp=n-i;
    for(let j=1;j<=sp;j++){
      steps.push({type:'check', i,j,line:3, note:`space loop: j = ${j}`});
      steps.push({type:'space', i,j,line:4,row:i-1,col:j-1, note:`print(" ")`});
    }
    for(let j=1;j<=i;j++){
      steps.push({type:'check', i,j,line:6, note:`star loop: j = ${j}`});
      steps.push({type:'star', i,j,line:7,row:i-1,col:sp+j-1, note:`print("*")`});
    }
    steps.push({type:'newline', i, line:9, note:`println()`});
  }
  for(let i=n-1;i>=1;i--){
    const rowIdx = n + (n-1-i);
    steps.push({type:'row-start', i, line:11, note:`निचला हिस्सा: i = ${i}`});
    const sp=n-i;
    for(let j=1;j<=sp;j++){
      steps.push({type:'check', i,j,line:12, note:`space loop: j = ${j}`});
      steps.push({type:'space', i,j,line:13,row:rowIdx,col:j-1, note:`print(" ")`});
    }
    for(let j=1;j<=i;j++){
      steps.push({type:'check', i,j,line:15, note:`star loop: j = ${j}`});
      steps.push({type:'star', i,j,line:16,row:rowIdx,col:sp+j-1, note:`print("*")`});
    }
    steps.push({type:'newline', i, line:18, note:`println()`});
  }
  return steps;
}

const GEN = {
  triangle: genTriangle, invTriangle: genInvTriangle, pyramid: genPyramid,
  invPyramid: genInvPyramid, diamond: genDiamond
};
const DIMS = {
  triangle:(n)=>({rows:n, cols:n}), invTriangle:(n)=>({rows:n, cols:n}),
  pyramid:(n)=>({rows:n, cols:n}), invPyramid:(n)=>({rows:n, cols:n}),
  diamond:(n)=>({rows:2*n-1, cols:n})
};

let steps=[], stepIdx=-1, n=5, pattern='triangle', playing=false, timer=null;
let grid=[], rows=0, cols=0;

function buildCode(){
  const lines = CODES[pattern];
  codeBox.innerHTML = lines.map((t,idx)=>
    `<code class="line" data-ln="${idx}"><span class="ln">${idx+1}</span>${escapeHtml(t)}</code>`
  ).join('');
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildGridDom(){
  const d = DIMS[pattern](n);
  rows=d.rows; cols=d.cols;
  grid = Array.from({length:rows}, ()=>Array(cols).fill(null));
  stageGrid.style.gridTemplateColumns = `repeat(${cols}, 24px)`;
  stageGrid.innerHTML='';
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.dataset.r=r; cell.dataset.c=c;
      stageGrid.appendChild(cell);
    }
  }
}

function resetAll(){
  pause();
  steps = GEN[pattern](n);
  stepIdx = -1;
  buildCode();
  buildGridDom();
  consoleBox.innerHTML = '<span class="caret"></span>';
  chipI.textContent='i = —'; chipI.classList.remove('on');
  chipJ.textContent='j = —'; chipJ.classList.remove('on');
  explainBox.innerHTML = '▶ दबाओ या "अगला" पर क्लिक करके शुरू करो।';
  document.querySelectorAll('code.line').forEach(l=>l.classList.remove('active'));
  progBar.style.width='0%';
}

function renderCell(r,c,type){
  const el = stageGrid.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if(!el) return;
  el.classList.remove('pulse');
  if(type==='star'){ el.classList.add('star'); el.textContent='★'; }
  else if(type==='space'){
    el.classList.remove('star');
    el.classList.toggle('space-dot', showSpaces.checked);
    el.textContent = showSpaces.checked ? '·' : '';
  }
  void el.offsetWidth;
  el.classList.add('pulse');
}
function clearCellVisual(r,c){
  const el = stageGrid.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if(!el) return;
  el.classList.remove('star','space-dot','pulse'); el.textContent='';
}

function applyStepForward(step){
  document.querySelectorAll('code.line').forEach(l=>l.classList.remove('active'));
  const activeLine = codeBox.querySelector(`code.line[data-ln="${step.line}"]`);
  if(activeLine) activeLine.classList.add('active');

  chipI.textContent = `i = ${step.i}`; chipI.classList.add('on');
  if(step.j!==undefined){ chipJ.textContent = `j = ${step.j}`; chipJ.classList.add('on'); }
  else { chipJ.textContent='j = —'; chipJ.classList.remove('on'); }

  explainBox.innerHTML = `<b>${step.note}</b>`;

  if(step.type==='star' || step.type==='space'){
    grid[step.row][step.col]=step.type;
    renderCell(step.row, step.col, step.type);
    const ch = step.type==='star' ? '*' : ' ';
    consoleBox.innerHTML = consoleBox.innerHTML.replace('<span class="caret"></span>', ch + '<span class="caret"></span>');
  } else if(step.type==='newline'){
    consoleBox.innerHTML = consoleBox.innerHTML.replace('<span class="caret"></span>', '\n<span class="caret"></span>');
  }
  consoleBox.scrollTop = consoleBox.scrollHeight;
}

function goToIndex(targetIdx){
  // rebuild visual state up to targetIdx (simple + reliable for small n)
  buildGridDom();
  consoleBox.innerHTML = '<span class="caret"></span>';
  document.querySelectorAll('code.line').forEach(l=>l.classList.remove('active'));
  for(let k=0;k<=targetIdx;k++){
    applyStepForward(steps[k]);
  }
  stepIdx = targetIdx;
  progBar.style.width = `${Math.max(0,((stepIdx+1)/steps.length)*100)}%`;
  if(stepIdx<0){
    chipI.textContent='i = —'; chipI.classList.remove('on');
    chipJ.textContent='j = —'; chipJ.classList.remove('on');
    explainBox.innerHTML = '▶ दबाओ या "अगला" पर क्लिक करके शुरू करो।';
  }
}

function stepForward(){
  if(stepIdx>=steps.length-1){ pause(); return; }
  stepIdx++;
  applyStepForward(steps[stepIdx]);
  progBar.style.width = `${((stepIdx+1)/steps.length)*100}%`;
  if(stepIdx>=steps.length-1) pause();
}
function stepBack(){
  if(stepIdx<=-1) return;
  goToIndex(stepIdx-1);
}

function play(){
  if(stepIdx>=steps.length-1) resetAllKeepStart();
  playing=true;
  playBtn.textContent='⏸ रोको';
  const speed = 11 - parseInt(speedRange.value,10); // invert: higher slider = faster
  const interval = 60 + speed*70;
  timer = setInterval(()=>{
    stepForward();
    if(stepIdx>=steps.length-1) pause();
  }, interval);
}
function pause(){
  playing=false;
  playBtn.textContent='▶ चलाएँ';
  if(timer){ clearInterval(timer); timer=null; }
}
function resetAllKeepStart(){
  stepIdx=-1;
  buildGridDom();
  consoleBox.innerHTML = '<span class="caret"></span>';
}

// events
patternSel.addEventListener('change', ()=>{ pattern=patternSel.value; resetAll(); });
nRange.addEventListener('input', ()=>{ n=parseInt(nRange.value,10); nVal.textContent=n; resetAll(); });
showSpaces.addEventListener('change', ()=>{ goToIndex(stepIdx); });
playBtn.addEventListener('click', ()=>{ playing ? pause() : play(); });
stepBtn.addEventListener('click', ()=>{ pause(); stepForward(); });
backBtn.addEventListener('click', ()=>{ pause(); stepBack(); });
resetBtn.addEventListener('click', resetAll);

// init
n = parseInt(nRange.value,10);
pattern = patternSel.value;
resetAll();
</script>
</body>
</html>
